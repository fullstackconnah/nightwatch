services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homelab-dashboard-proxy
    # always, not unless-stopped: the dashboard is the thing you look at to find out
    # why a reboot went wrong, so it must come back even if it was stopped when the
    # box went down. unless-stopped deliberately leaves a manually-stopped container
    # down across a reboot, which is the one moment this pair must not be down.
    # The proxy carries the same policy because the dashboard is useless without it.
    restart: always
    environment:
      # read scopes
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - PING=1
      - SYSTEM=1
      # write scopes — start/stop/restart/create only; EXEC stays off
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - EXEC=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    labels:
      - dashboard.enable=false # sidecar, no tile

  dashboard:
    build: .
    container_name: homelab-dashboard
    restart: always # see the note on socket-proxy above
    ports:
      - "3005:3000" # temporary port; claim 3001 only after Homepage is decommissioned
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - PUBLIC_HOST=192.168.1.70
      - HOST_NAME=homelab # /host/proc hostname resolves to the container's UTS namespace, not the host's
      - DOCKGE_URL=http://192.168.1.70:5001
      - DATA_DIR=/app/data
      - NVIDIA_VISIBLE_DEVICES=all
      # utility = nvidia-smi/NVML only. No CUDA, no video encode: this container
      # only ever reads counters, so it has no business holding an encode session.
      - NVIDIA_DRIVER_CAPABILITIES=utility
    # ADMIN_PASSWORD_HASH and SESSION_SECRET come from .env (never committed).
    #
    # CRITICAL: every '$' in the hash MUST be written as '$$' in .env. Compose expands
    # $ sequences while PARSING .env, so a raw bcrypt hash ($2a$12$...) reaches the
    # container truncated (60 chars -> 38) and every login fails with a correct
    # password. This applies via env_file AND via ${...} in `environment:` — the
    # mangling is in the dotenv layer, so escaping is the only fix.
    #   store:  ADMIN_PASSWORD_HASH=$$2a$$12$$xxxxx...
    #   verify: docker exec <c> sh -c 'printf %s "$ADMIN_PASSWORD_HASH" | wc -c'  -> 60
    env_file:
      - path: .env
        required: false
    # GPU telemetry for the /gpu route. Verified working 2026-07-30, after the host
    # reboot resynced the nvidia kernel module with its userspace libraries.
    #
    # If this container ever fails to CREATE with an NVML error from the CDI
    # generator, the driver has been upgraded in place without a reboot again: the
    # toolkit cannot build a device spec while the loaded module and the libs
    # disagree. Compare /proc/driver/nvidia/version against
    # /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.* and reboot; see DEPLOY.md.
    #
    # Requires a glibc base image — the toolkit injects the host's own glibc-linked
    # nvidia-smi, which cannot exec on musl. See the note in the Dockerfile.
    runtime: nvidia
    volumes:
      - ./data:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro,rslave
    depends_on:
      - socket-proxy
    networks:
      - internal
    labels:
      - dashboard.group=System
      - dashboard.url=http://192.168.1.70:3005

networks:
  internal:
