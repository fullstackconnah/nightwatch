services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homelab-dashboard-proxy
    restart: unless-stopped
    environment:
      # read scopes
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - PING=1
      # write scopes — start/stop/restart/create only; EXEC stays off
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - EXEC=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    labels:
      - dashboard.enable=false # sidecar, no tile

  dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "3005:3000" # temporary port; claim 3001 only after Homepage is decommissioned
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - PUBLIC_HOST=192.168.1.70
      - DOCKGE_URL=http://192.168.1.70:5001
      - DATA_DIR=/app/data
      # set both in the .env file next to this compose file (never in git);
      # bcrypt hashes contain '$' — keep them in .env, NOT inline here, or
      # compose will mangle them via variable interpolation.
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro,rslave
    depends_on:
      - socket-proxy
    networks:
      - internal
    labels:
      - dashboard.group=System
      - dashboard.url=http://192.168.1.70:3005

networks:
  internal:
