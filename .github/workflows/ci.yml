name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile base (node:22-slim)
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # The media worker's suites probe and encode real clips; they fail, not skip, without it.
      # A stalled mirror once hung this step 14 min; fail fast and let a re-run retry.
      - run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        timeout-minutes: 6
      - run: npm test
      - run: npm run build
