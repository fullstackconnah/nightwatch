name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile base (node:22-slim)
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # The media worker's suites probe and encode real clips; they fail, not skip, without it.
      # A stalled mirror once hung this step 14 min; fail fast and let a re-run retry.
      - run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
      # The debs are cached per runner image (ImageOS + ImageVersion), so the mirror is only
      # needed when the image changes; a slow mirror then costs one re-run, not every run.
      - uses: actions/cache@v4
        id: ffdebs
        with:
          path: ~/ffdebs
          key: ffmpeg-debs-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Download ffmpeg debs (cache miss)
        if: steps.ffdebs.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only ffmpeg
          mkdir -p ~/ffdebs
          cp /var/cache/apt/archives/*.deb ~/ffdebs/
          # --download-only fetches nothing if ffmpeg is already on the image
          ls ~/ffdebs/*.deb >/dev/null 2>&1 || { echo "::error::no debs downloaded; is ffmpeg preinstalled on this image?"; exit 1; }
      - name: Install ffmpeg from cached debs
        timeout-minutes: 2
        run: |
          sudo apt-get install -y --no-install-recommends "$HOME"/ffdebs/*.deb
          ffmpeg -version | head -1
      - run: npm test
      - run: npm run build
